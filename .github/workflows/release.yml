name: Release

# The only pipeline. It runs when a GitHub Release is published: it builds and
# tests, then publishes the engine to npm (@gitdocai/engine) and the self-host
# image to GitHub Container Registry. The version is the release tag
# (v0.1.0 → 0.1.0). If anything fails, nothing is published.
#
# Jobs run on GitHub-hosted runners (`ubuntu-latest`) for now. To use the
# organisation's own runner again, set `runs-on: gitdocai-dev` in every job.
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22' # building needs Node >= 22.12 (Astro 7)
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: engine
          path: engine/

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node: [20, 22]
    # A real OpenSearch for the adapter tests (they skip without the URL).
    services:
      opensearch:
        image: opensearchproject/opensearch:2.19.1
        ports: ['9200']
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: 'true'
          DISABLE_INSTALL_DEMO_CONFIG: 'true'
          OPENSEARCH_JAVA_OPTS: '-Xms512m -Xmx512m'
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health"
          --health-interval 10s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/download-artifact@v4
        with:
          name: engine
          path: engine/

      # The built engine runs on Node 20 and 22; the tests need no install.
      - run: npm test
        env:
          # the service's host port is assigned per job (the runner is shared)
          GITDOC_TEST_OPENSEARCH_URL: http://localhost:${{ job.services.opensearch.ports['9200'] }}

  npm:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # Publish exactly what was tested.
      - uses: actions/download-artifact@v4
        with:
          name: engine
          path: engine/

      # Same mechanism as the CLI's old release action: the version comes from
      # the tag, and an .npmrc next to the package reads the token from NPM_TOKEN.
      - name: Publish @gitdocai/engine
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ github.ref_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          VERSION="${VERSION#v}"

          cd engine
          npm pkg set version="$VERSION"

          echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' > .npmrc

          # A pre-release must not become `latest`.
          if [ "$PRERELEASE" = "true" ]; then
            npm publish --tag next --access public
          else
            npm publish --access public
          fi

  image:
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags from the release tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/gitdocai/gitdoc-server
          tags: type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/selfhost/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
