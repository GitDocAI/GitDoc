# Self-hosted gitdoc server: one container, one volume.
#
#   cp .env.example .env        # set PUBLISH_TOKEN
#   docker compose up -d --build
#
# Then, from your docs folder:
#   gitdoc connect http://localhost:8080 --token <PUBLISH_TOKEN>
#   gitdoc publish
services:
  gitdoc:
    build:
      context: ../..
      dockerfile: deploy/selfhost/Dockerfile
    image: gitdocai/gitdoc-server:dev
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # Publishing is disabled unless this is set.
      PUBLISH_TOKEN: ${PUBLISH_TOKEN:?set PUBLISH_TOKEN in .env}
      # With one site published it answers on any host; with several, each
      # answers only on its own hostname.
      SINGLE_SITE: "true"
      LIST_SITES: "true"
      PUBLISH_MAX_MB: ${PUBLISH_MAX_MB:-200}
      # Search. Empty = the built-in index (no extra service). To use
      # OpenSearch see .env.example (and `--profile opensearch` below).
      SEARCH_BACKEND: ${SEARCH_BACKEND:-}
      OPENSEARCH_URL: ${OPENSEARCH_URL:-}
      OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME:-}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:-}
      OPENSEARCH_INSECURE: ${OPENSEARCH_INSECURE:-}
      EMBEDDINGS_URL: ${EMBEDDINGS_URL:-}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-}
      EMBEDDINGS_API_KEY: ${EMBEDDINGS_API_KEY:-}
    volumes:
      - gitdoc-data:/data

  # Optional: only started with `docker compose --profile opensearch up -d`
  # (or COMPOSE_PROFILES=opensearch in .env). Reachable only from this compose
  # network, so its security plugin is off; if you expose it, turn it on.
  opensearch:
    profiles: ["opensearch"]
    image: opensearchproject/opensearch:2.19.1
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  gitdoc-data:
  opensearch-data:
